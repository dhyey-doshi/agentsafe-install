[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agentsafe-install"
version = "0.1.0"
description = "A local-first pre-install trust gate for AI coding agents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["typer>=0.12", "httpx>=0.27", "pydantic>=2.7"]

[project.scripts]
agentsafe = "agentsafe.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
